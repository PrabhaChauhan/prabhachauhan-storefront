version: 1

indices:
  news:
    target: /news-index.json
    include:
      - 'news/**'
    exclude:
      - 'news/tags/**'
      - 'news/authors/**'
      - 'drafts/**'
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: |
          attribute(el, 'content')
      newsCategory:
        select: head > meta[name="news-category"]
        value: |
          attribute(el, 'content')
      newsTags:
        select: head > meta[name="news-tags"]
        values: |
          match(attribute(el, 'content'), '([^,]+)')
      author:
        select: head > meta[name="author"]
        value: |
          attribute(el, 'content')
      authorSlug:
        select: head > meta[name="author-slug"]
        value: |
          attribute(el, 'content')
      publicationDate:
        select: head > meta[name="publication-date"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")