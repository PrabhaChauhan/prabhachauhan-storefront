version: 1

indices:
  news:
    target: /news-index.json
    include:
      - /news/**
    exclude:
      - /news/index
    properties:
      title:
        select: div > div > div:has(#title) > div:last-child
        value: textContent(el)

      description:
        select: div > div > div:has(#description) > div:last-child
        value: textContent(el)

      publishDate:
        select: div > div > div:has(#publish-date) > div:last-child
        value: textContent(el)

      image:
        select: div > div > div:has(#image) > div:last-child
        value: textContent(el)